# nodepool 配置。改完直接再跑 python update.py 生效。

# 访问 GitHub / gist 用的代理（你的客户端系统代理端口）。
# 置空字符串则直连。
proxy: "http://127.0.0.1:7897"

search:
  query: "vless://"      # gist 全文搜索关键词
  pages: 10              # 翻几页（每页约 10 个 gist）
  page_delay: 2.0        # 翻页间隔秒数，别调太小以免被限流
  max_seconds: 420       # 采集软时间预算，保留时间给检测与发布

collect:
  min_nodes_per_gist: 3  # 单个 gist 节点数少于此值则跳过（多半是个人自建配置误公开）
  max_candidates: 600    # 单次测试的候选节点上限（去重后，含历史池；越大越慢但找到越多）

connectivity:
  test_url: "https://www.gstatic.com/generate_204"
  verification_url: null # 与 Clash 点击延迟测试一致，重复检测同一地址
  expected_status: 204   # 严格检查响应状态，拒绝劫持页/错误页假通过
  timeout_ms: 5000
  rounds: 4              # 测几轮延迟
  min_pass: 3            # 至少成功几轮才算可用（4 过 3：淘汰一测就抖的）
  concurrency: 32

purity:
  enabled: false        # 默认不查询 IPPure；已有评分仅展示参考
  required: false       # 不以评分限制输出或稳定池晋升；高分/缺失/过期均可用
  api: "https://my.ippure.com/v1/info"
  max_score: 40          # 仅 required:true 时作为评分上限
  cache_hours: 24        # 同一节点的有效评分在此时间内复用
  concurrency: 4         # 同时查询数（对 ippure 温和一点）
  stagger: 0.4           # 每次请求之间最小间隔秒数
  request_timeout: 15
  batch_size: 16         # 分批创建监听端口
  max_seconds: 420       # 达到预算后，未测节点留待下轮
  # 分级：[下限, 上限, 名称]，按 ippure 官方刻度
  tiers:
    - [0, 15, "极度纯净"]
    - [15, 25, "纯净"]
    - [25, 40, "中性"]

pool:
  max_fail: 3            # 普通节点连续失败后冷却，保留记录供恢复
  max_size: 20000        # 节点池总量上限，超出时优先淘汰从未连通的旧节点
  stale_days: 3          # 从未连通且超过此天数未再出现的节点直接清理
  stable_min_passes: 5   # 连续测活成功 5 次后晋升稳定池；评分不影响默认策略
  stable_min_rate: 0.8   # 最近 history_size 次测试成功率至少 80%
  history_size: 20
  stable_max_fail: 12    # 稳定节点失败至少 12 次且超过宽限期才冷却
  stable_grace_days: 7   # 稳定节点最后成功后 7 天内保留复测资格
  cooldown_hours: 24     # 冷却后可重新测试，采集不重置历史
  exploration_ratio: 0.25 # 为未验证节点预留 25% 探索名额

mihomo:
  version: "v1.19.11"    # 与本机 Clash Verge 使用的内核版本一致
  controller: "127.0.0.1:19090"
  secret: "nodepool"     # 本地 external-controller 密钥
  base_listen_port: 20000  # 纯净度探测用的起始监听端口
  startup_timeout: 20

output:
  file: "output/clash.yaml"
  # 规则入口默认自动，也能直接点击节点手动固定；不生成评分或稳定子组
  group_select: "🚀 节点选择"
  group_auto: "♻️ 自动选择"
  max_test_age_hours: 12 # 未轮到复测的节点，最近测活有效期

publish:
  enabled: true                 # 有 token 就自动发布到 secret gist
  client_health_required: false  # 云端检测通过即可发布，不要求本机白名单
  gist_filename: "clash.yaml"
  pool_filename: "stable-pool.json" # 同一 secret gist 备份稳定节点，缓存丢失时恢复
  candidate_filename: "candidates.yaml" # 云端合格候选，供本机复测，不直接导入客户端
  client_health_filename: "client-health.json" # 本机验证白名单，verify.py 写入后启用
  client_health_max_age_hours: 168 # 本机证明有效期；云端仍独立复测，过期保留原订阅
  gist_description: "nodepool auto-updated clash subscription"
