name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Prepare configured mihomo core
        run: python -c "from pathlib import Path; from nodepool.config import load_config; from nodepool.mihomo import ensure_binary; from nodepool.util import make_session; ensure_binary(Path('.'), make_session(None), load_config(Path('config.yaml'))['mihomo']['version'])"
      - run: python -m unittest discover -s tests -v
