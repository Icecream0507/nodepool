name: update-nodes

on:
  schedule:
    - cron: "7 */3 * * *"   # 每 3 小时（UTC；时刻不保证精确，GitHub 可能延迟几分钟）
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: read

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install -r requirements.txt

      # 跨运行保留节点池/纯净度缓存（尽力而为；丢了也不影响订阅链接）
      - name: Restore pool cache
        id: pool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: ${{ runner.os }}-nodepool-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-nodepool-v2-
            nodepool-data-

      - name: Restore mihomo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: ${{ runner.os }}-${{ runner.arch }}-mihomo-${{ hashFiles('nodepool/mihomo.py') }}

      - name: Prepare mihomo for native validation
        run: python -c "from pathlib import Path; from nodepool.mihomo import ensure_binary; from nodepool.util import make_session; ensure_binary(Path('.'), make_session(None))"

      - name: Validate logic and native core
        run: python -m unittest discover -s tests -v

      - name: Run update (直连，云端无需代理)
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          NODEPOOL_GIST_ID: ${{ secrets.GIST_ID }}
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
        run: python update.py --proxy ""

      - name: Save pool even if update failed
        if: ${{ always() && hashFiles('data/pool.json') != '' && steps.pool-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: ${{ steps.pool-cache.outputs.cache-primary-key }}
